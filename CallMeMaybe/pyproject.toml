[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding for LLMs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "huggingface-hub",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu" },
]

[project.optional-dependencies]
dev = [
"flake8",
"mypy"
]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "llm_sdk.*",
    "fire.*",
    "colorama.*",
]
ignore_missing_imports = true
ignore_errors = true

[tool.flake8]
max-line-length = 120
extend-ignore = "E203"